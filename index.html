<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Little World 🌷</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ead8c8">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Georgia, serif;
  background: #f7efe5;
  color: #5b4840;
}

header {
  text-align: center;
  padding: 35px 20px 20px;
}

header h1 {
  font-size: 42px;
  margin: 0;
}

header p {
  color: #92786c;
}

.room {
  max-width: 950px;
  min-height: 620px;
  margin: 20px auto;
  background: #ead8c8;
  border-radius: 30px;
  position: relative;
  overflow: hidden;
  padding: 35px 25px 100px;
  box-shadow: 0 15px 40px rgba(70,50,40,.15);
}

.welcome {
  text-align: center;
  margin-bottom: 35px;
}

.welcome h2 {
  font-size: 30px;
}

.items {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  max-width: 700px;
  margin: auto;
}

.item {
  border: none;
  background: #fffaf5;
  border-radius: 22px;
  padding: 25px 10px;
  font-family: Georgia, serif;
  font-size: 18px;
  color: #5b4840;
  cursor: pointer;
  box-shadow: 0 6px 15px rgba(70,50,40,.1);
  transition: .2s;
}

.item:hover {
  transform: translateY(-5px);
}

.emoji {
  display: block;
  font-size: 45px;
  margin-bottom: 10px;
}

.floor {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 65px;
  background: #b98c69;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(50,35,30,.45);
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 10;
}

.modal-box {
  background: #fffaf5;
  width: min(600px,100%);
  max-height: 85vh;
  overflow-y: auto;
  border-radius: 25px;
  padding: 25px;
  position: relative;
}

.close {
  position: absolute;
  right: 18px;
  top: 12px;
  border: none;
  background: none;
  font-size: 25px;
  cursor: pointer;
}

.modal-box h2 {
  text-align: center;
}

input, textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #d8c1b2;
  border-radius: 12px;
  margin: 8px 0;
  font-family: inherit;
}

textarea {
  min-height: 130px;
  resize: vertical;
}

.add-btn {
  width: 100%;
  border: none;
  padding: 12px;
  border-radius: 12px;
  background: #d7b7a1;
  color: #fff;
  font-family: inherit;
  cursor: pointer;
}

.saved {
  margin-top: 20px;
}

.saved-item {
  background: #f7efe5;
  padding: 12px;
  border-radius: 15px;
  margin: 10px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.delete {
  border: none;
  background: #ead0c5;
  border-radius: 8px;
  padding: 6px 9px;
  cursor: pointer;
}

@media(max-width:650px) {
  .items {
    grid-template-columns: repeat(2,1fr);
  }

  header h1 {
    font-size: 35px;
  }
}
</style>
</head>

<body>

  <h1>my little world 🌷</h1>
  <p>a tiny corner of the internet that belongs to me</p>
</header>
